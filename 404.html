<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Collin White</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital@0;1&family=Libre+Franklin:wght@500;600&display=swap">
<style>
  :root { --paper:#FBFAF6; --ink:#1C1F1D; --ink-2:#4A4F4B; --green:#17352A; --gold:#9E8A48; }
  @media (prefers-color-scheme: dark) { :root { --paper:#141816; --ink:#ECEAE2; --ink-2:#B8BCB5; --green:#B9CFC2; --gold:#C2AE68; } }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"Libre Caslon Text",Georgia,serif; }
  .page { max-width:640px; margin:0 auto; padding:96px 28px; }
  .label { font-family:"Libre Franklin",Arial,sans-serif; font-size:11.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--green); }
  h1 { font-weight:400; font-size:40px; margin:8px 0 12px; line-height:1.05; }
  p { color:var(--ink-2); font-size:17px; line-height:1.55; }
  a { color:var(--ink); text-decoration:underline; text-decoration-color:var(--gold); text-underline-offset:3px; }
</style>
</head>
<body>
<div class="page">
  <div class="label">404</div>
  <h1>That page isn't here.</h1>
  <p>The address may be left over from an earlier version of this site. Everything is on the <a href="/">front page</a>.</p>
</div>
</body>
</html>
